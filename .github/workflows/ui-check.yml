name: Emulator UI check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29          # Android 10
            profile: pixel_2
          - api: 35          # Android 15 (edge-to-edge)
            profile: pixel_6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run game on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OUT: shots
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/ui-check.sh

      - name: Publish screenshots to branch
        if: always()
        run: |
          B=ci-screenshots-api${{ matrix.api }}
          mkdir -p /tmp/pub && cp -r shots/. /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub
          git init -q -b "$B"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Emulator screenshots API ${{ matrix.api }} for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$B"

      - name: Fail on crash
        run: |
          cat shots/RESULT.txt
          grep -q "NO CRASH" shots/RESULT.txt
